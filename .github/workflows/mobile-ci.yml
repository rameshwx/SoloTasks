name: mobile-ci

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: |
          cd mobile
          flutter pub get
      - name: Analyze
        run: |
          cd mobile
          flutter analyze
      - name: Test
        run: |
          cd mobile
          flutter test

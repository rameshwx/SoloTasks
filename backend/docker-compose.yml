services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: solotasks
      POSTGRES_USER: solotasks
      POSTGRES_PASSWORD: solotasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  mc-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/solotasks || true &&
      mc anonymous set private local/solotasks || true
      "

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - minio
      - mc-init
    env_file:
      - .env
    volumes:
      - storage_data:/data/storage
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  minio_data:
  storage_data:

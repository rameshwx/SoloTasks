services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: solotasks
      POSTGRES_USER: solotasks
      POSTGRES_PASSWORD: solotasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  mc-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/solotasks || true &&
      mc anonymous set private local/solotasks || true
      "

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - minio
      - mc-init
    env_file:
      - .env
    volumes:
      - storage_data:/data/storage
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"

volumes:
  pgdata:
  minio_data:
  storage_data:

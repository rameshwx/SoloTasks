name: solotasks
description: Kronos mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  connectivity_plus: ^6.1.4
  workmanager: ^0.7.0
  file_picker: ^10.3.2
  image_picker: ^1.2.0
  table_calendar: ^3.2.0
  flutter_animate: ^4.5.2
  pdfrx: ^1.1.7
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.0
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5
  freezed: ^3.0.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ic_launcher.png
  remove_alpha_ios: true
